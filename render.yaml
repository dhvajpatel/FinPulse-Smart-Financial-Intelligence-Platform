services:
  - type: web
    name: finpulse-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    # Install dependencies and initialise the database schema (no CSV seeding)
    buildCommand: pip install -r requirements.txt && python load_data.py
    # Launch FastAPI
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
